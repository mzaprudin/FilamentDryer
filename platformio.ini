[platformio]
default_envs = esp32dev
data_dir = data

[env:esp32dev]
# Arduino-ESP32 2.0.17 keeps the image within the existing 0x140000 OTA slots.
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
test_build_src = yes
board_build.partitions = partitions_ota_4mb.csv
board_build.filesystem = littlefs
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DAPP_VERSION=\"0.2.2\"
lib_deps =
    adafruit/Adafruit AHTX0 @ 2.0.6
    adafruit/Adafruit Unified Sensor @ 1.1.15
    adafruit/Adafruit BusIO @ 1.17.4
    adafruit/Adafruit SH110X @ 2.1.15
    adafruit/Adafruit GFX Library @ 1.13.0
    bogde/HX711 @ 0.7.5
    olikraus/U8g2 @ 2.36.18
    madhephaestus/ESP32Encoder @ 5.0.0
    madhephaestus/ESP32Servo @ 1.2.1
    bblanchon/ArduinoJson @ 6.21.6

# Over-the-air flashing: ArduinoOTA over Wi-Fi, no USB cable needed.
#   pio run -e esp32dev_ota -t upload
# Override the target with --upload-port 192.168.1.238 when mDNS is blocked.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = dryer.local

[env:native]
platform = native @ 1.2.1
test_framework = unity
lib_deps = throwtheswitch/Unity @ 2.6.1
test_build_src = yes
build_src_filter =
    +<config/AppConfig.cpp>
    +<control/AhSlopeEstimator.cpp>
    +<control/HeaterThermostat.cpp>
    +<control/PidController.cpp>
    +<control/HumidityMath.cpp>
    +<control/PurgeScheduler.cpp>
    +<core/DryingStateMachine.cpp>
    +<services/ActuatorService.cpp>
    +<services/ControlService.cpp>
    +<services/SafetyService.cpp>
build_flags =
    -std=c++17

[env:esp32dev_test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DIDRYER_DISABLE_NTC_SAFETY
