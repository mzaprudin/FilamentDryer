name: CI

on:
  push:
    branches: [main, 'portfolio/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Native and telemetry tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            tools/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-tests-${{ runner.os }}-${{ hashFiles('platformio.ini', 'requirements-dev.txt') }}
      - run: mkdir -p reports
      - name: Native control tests
        run: pio test -e native --junit-output-path reports/native.xml 2>&1 | tee reports/native.log
      - name: Telemetry capture and plot tests
        run: python -m unittest discover -s test -p 'test_telemetry.py' -v 2>&1 | tee reports/telemetry.log
      - name: Resolved dependencies
        if: always()
        run: |
          python -m pip freeze > reports/python-packages.txt
          pio pkg list -e native --verbose > reports/platformio-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: reports/
          if-no-files-found: error

  firmware:
    name: Firmware (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32dev, esp32dev_ota]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.platformio
          key: pio-firmware-${{ runner.os }}-${{ hashFiles('platformio.ini', 'requirements-dev.txt') }}
      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
      - name: Build web panel image
        run: pio run -e ${{ matrix.environment }} -t buildfs
      - name: Record versions and checksums
        run: |
          mkdir -p reports
          pio pkg list -e ${{ matrix.environment }} --verbose > reports/platformio-packages.txt
          python -m pip freeze > reports/python-packages.txt
          git rev-parse HEAD > reports/source-commit.txt
          sha256sum .pio/build/${{ matrix.environment }}/*.bin > reports/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-${{ matrix.environment }}
          include-hidden-files: true
          path: |
            .pio/build/${{ matrix.environment }}/firmware.bin
            .pio/build/${{ matrix.environment }}/firmware.elf
            .pio/build/${{ matrix.environment }}/bootloader.bin
            .pio/build/${{ matrix.environment }}/partitions.bin
            .pio/build/${{ matrix.environment }}/littlefs.bin
            platformio.ini
            partitions_ota_4mb.csv
            reports/
          if-no-files-found: error
